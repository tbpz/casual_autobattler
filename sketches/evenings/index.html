<title>Evenings Map Sketch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one portrait column, the same as the map sketches before it. "Found" meter on top, a scrolling fogged map
   in the middle that follows you, hint line and creature book below. A card pops up when you find a creature.
   Evenings: one new map each evening. Creatures you catch as followers walk behind you and act by their own rule,
   and they come with you to the next map. Each map has its own world thing, never explained on screen.
   Answers live in the rules block and in check-evenings.js, never in any text the player reads. */
:root {
  color-scheme: dark;
  --night: #121726;
  --panel: #1b2236;
  --line: #2c3550;
  --ink: #ece8da;
  --muted: #9aa1b8;
  --gold: #f2c14e;
  --ember: #ff8a5c;
  --helper: #6c8fd0;
  --fog: #232a42;
  --fog-2: #272f4a;
  --grass: #4c7744;
  --grass-2: #527d49;
  --high: #6f9b5c;
  --high-2: #77a363;
  --tree: #2c4d30;
  --tree-top: #3b6640;
  --water: #2d5a8c;
  --water-2: #3a6aa0;
  --wood: #9a6a3c;
  --wood-dark: #6a4524;
  --stone: #2a2e3b;
  --stone-2: #323747;
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tile: 30px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font: 15px/1.4 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 8px; }
.score { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.score b { font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.score small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.meter { height: 4px; width: 72px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }
.spacer { flex: 1; }
.btn {
  font: 600 12px var(--f-body); color: var(--muted); background: none;
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; cursor: pointer; white-space: nowrap;
}
.btn.on { color: var(--night); background: var(--gold); border-color: var(--gold); }
.btn.armed { color: var(--night); background: #e07a5f; border-color: #e07a5f; }
.btn:focus-visible, .slot:focus-visible, .who:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
/* who is following you: tap to change */
.who { display: flex; align-items: center; gap: 4px; background: none; border: 2px solid var(--helper); border-radius: 50%;
  padding: 1px; color: var(--ink); font: 600 12px var(--f-body); cursor: pointer; }
.who[hidden] { display: none; }
.who svg { width: 28px; height: 28px; background: #2a3350; border-radius: 50%; }
.who span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* map view: the map slides inside it so you stay near the middle */
.view { flex: 1; min-height: 0; position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); background: var(--fog); touch-action: none; user-select: none; -webkit-user-select: none; }
.map {
  position: absolute; left: 0; top: 0; display: grid;
  grid-auto-rows: var(--tile);
  transition: transform .28s ease-out;
  touch-action: none; user-select: none;
}
.t { position: relative; }
/* the thumb stick: shows up where your thumb lands on the map, follows it, goes when you let go */
.stick {
  position: absolute; width: 92px; height: 92px; margin: -46px 0 0 -46px; z-index: 7; pointer-events: none;
  border-radius: 50%; border: 2px solid rgba(236,232,218,.38); background: rgba(18,23,38,.42);
}
.stick[hidden] { display: none; }
.stick i {
  position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%;
  background: rgba(242,193,78,.9); box-shadow: 0 0 0 3px rgba(18,23,38,.5), 0 0 14px rgba(242,193,78,.55);
}
.fog { background: var(--fog); }
.fog.alt { background: var(--fog-2); }
.g-grass { background: var(--grass); }
.g-grass.alt { background: var(--grass-2); }
.g-tree { background: radial-gradient(circle at 50% 45%, var(--tree-top) 0 42%, transparent 44%), var(--tree); }
.g-stone { background: linear-gradient(135deg, var(--stone-2) 0 22%, var(--stone) 22% 78%, var(--stone-2) 78%); }
.g-high { background: var(--high); }
.g-high.alt { background: var(--high-2); }
.g-ramp { background: repeating-linear-gradient(0deg, #9a9478 0 5px, #7d775f 5px 8px); }
.g-water, .g-logw, .g-raised, .g-bridge {
  background: repeating-linear-gradient(165deg, var(--water) 0 6px, var(--water-2) 6px 8px, var(--water) 8px 14px); background-size: 100% 28px; animation: lap 3s linear infinite; }
@keyframes lap { from { background-position: 0 0; } to { background-position: 0 28px; } }

/* dry brambles: dark, thorny, a little straw-coloured */
.g-bramble { background:
  radial-gradient(circle at 25% 30%, #8a7a3e 0 9%, transparent 10%),
  radial-gradient(circle at 72% 62%, #8a7a3e 0 8%, transparent 9%),
  radial-gradient(circle at 40% 78%, #6d5f2c 0 10%, transparent 11%),
  repeating-linear-gradient(45deg, transparent 0 5px, rgba(40,30,10,.55) 5px 6px),
  repeating-linear-gradient(-45deg, transparent 0 6px, rgba(40,30,10,.45) 6px 7px), #4f5a2a; }
/* what's left after a fire */
.g-ash { background:
  radial-gradient(circle at 30% 35%, #5a4a40 0 8%, transparent 9%),
  radial-gradient(circle at 70% 70%, #4a3e38 0 9%, transparent 10%), #3a3a3a; }
/* a lone tree: a trunk and a big round top, standing on grass */
.g-lone, .g-stump, .g-log, .g-sprout, .g-post { background: var(--grass); }
.g-lone::before { content: ""; position: absolute; left: 40%; right: 40%; top: 50%; bottom: 6%; background: #5e3c1c; border-radius: 2px; }
.g-lone::after { content: ""; position: absolute; inset: -8% 4% 30% 4%; border-radius: 50%; z-index: 1;
  background: radial-gradient(circle at 38% 35%, #6fae5a 0 25%, #4c8a40 26% 70%, #3a6e32 71%); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.g-stump::before { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: radial-gradient(circle, #d9b07a 0 30%, #b08350 31% 60%, #7a5230 61%); }
/* a fallen tree: one long log, lying the way it fell */
.log { position: absolute; z-index: 1; pointer-events: none; background: repeating-linear-gradient(90deg, #8a5e34 0 6px, #7a5230 6px 8px); border: 2px solid #4e3216; border-radius: 6px; }
.log.h { left: -2%; right: -2%; top: 24%; bottom: 24%; }
.log.v { top: -2%; bottom: -2%; left: 24%; right: 24%; background: repeating-linear-gradient(0deg, #8a5e34 0 6px, #7a5230 6px 8px); }
/* a tree that fell against the cliff: a log you can walk up */
.g-leanlog { background: var(--grass); }
.g-leanlog::before { content: ""; position: absolute; left: 22%; right: 22%; top: -30%; bottom: 4%; border-radius: 6px; z-index: 2;
  background: repeating-linear-gradient(0deg, #9a6a3c 0 6px, #7a5230 6px 9px); border: 2px solid #4e3216; transform: skewX(-6deg); }
/* a sprout at the foot of a cliff (or up on it) */
.g-sproutup { background: var(--high); }
.g-sprout::before, .g-sproutup::before { content: ""; position: absolute; left: 42%; right: 42%; top: 40%; bottom: 18%; background: #7fc45a; border-radius: 2px; }
.g-sprout::after, .g-sproutup::after { content: ""; position: absolute; left: 24%; right: 24%; top: 26%; bottom: 46%;
  background: radial-gradient(ellipse at 20% 60%, #8fd46a 0 34%, transparent 36%), radial-gradient(ellipse at 80% 60%, #8fd46a 0 34%, transparent 36%); }
/* a vine grown up the cliff: green rungs you can climb */
.g-vine { background: repeating-linear-gradient(0deg, #5f9a44 0 4px, #3e6e2e 4px 8px), #3e6e2e; }
.g-vine::before { content: ""; position: absolute; inset: 0; background:
  radial-gradient(circle at 25% 20%, #9fe07a 0 9%, transparent 10%), radial-gradient(circle at 75% 55%, #9fe07a 0 9%, transparent 10%),
  radial-gradient(circle at 30% 85%, #9fe07a 0 9%, transparent 10%); }
/* a seed in a patch of bare dark earth */
.g-seed { background: var(--grass); }
.g-seed::before { content: ""; position: absolute; inset: 18%; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #6a4a2c, #4a321c 70%); box-shadow: inset 0 2px 0 rgba(0,0,0,.35); }
.g-seed::after { content: ""; position: absolute; left: 41%; right: 41%; top: 36%; bottom: 40%; border-radius: 50% 50% 45% 45%; background: #e2c48a; box-shadow: 0 1px 0 #7a5a30; transform: rotate(18deg); }
/* the rope post across the river, and the bridge it holds up */
.g-post::before { content: ""; position: absolute; left: 38%; right: 38%; top: 10%; bottom: 10%; background: #8a5e34; border: 2px solid #4e3216; border-radius: 2px; }
.g-post::after { content: ""; position: absolute; left: -10%; right: 50%; top: 22%; height: 2px; background: #d8c9a0; transform: rotate(-12deg); transform-origin: right; }
.g-raised::before { content: ""; position: absolute; right: -4%; top: -40%; bottom: 10%; width: 26%; z-index: 2;
  background: repeating-linear-gradient(0deg, #a07a52 0 6px, #6e5236 6px 8px); border: 2px solid #4e3216; border-radius: 2px; box-shadow: -4px 4px 0 rgba(0,0,0,.35); }
.g-bridge::before { content: ""; position: absolute; inset: 15% 0; background: repeating-linear-gradient(90deg, #a07a52 0 7px, #6e5236 7px 8px); }

/* high ground stands up: a light lip on its edges, a rock wall under it, a shadow beside it */
.g-high.edgeS, .g-sproutup.edgeS { box-shadow: inset 0 -3px 0 #a9cf8e; }
.g-high.edgeE, .g-sproutup.edgeE { box-shadow: inset -3px 0 0 #a9cf8e; }
.g-high.edgeS.edgeE { box-shadow: inset 0 -3px 0 #a9cf8e, inset -3px 0 0 #a9cf8e; }
.t.wallN > .wall, .t.shadeW > .wall { position: absolute; inset: 0; pointer-events: none; }
.t.wallN > .wall {
  background:
    linear-gradient(180deg, transparent 0 50%, rgba(0,0,0,.42) 50%, transparent 78%),
    repeating-linear-gradient(90deg, transparent 0 22%, rgba(0,0,0,.18) 22% 27%) top / 100% 50% no-repeat,
    linear-gradient(180deg, #8d8471 0 10%, #6f6857 10% 50%, transparent 50%);
}
.t.shadeW > .wall { background: linear-gradient(90deg, rgba(0,0,0,.45), transparent 55%); }
.t.wallN.shadeW > .wall {
  background:
    linear-gradient(90deg, rgba(0,0,0,.45), transparent 55%),
    linear-gradient(180deg, transparent 0 50%, rgba(0,0,0,.42) 50%, transparent 78%),
    repeating-linear-gradient(90deg, transparent 0 22%, rgba(0,0,0,.18) 22% 27%) top / 100% 50% no-repeat,
    linear-gradient(180deg, #8d8471 0 10%, #6f6857 10% 50%, transparent 50%);
}
/* while you stand up high, everything below goes dim */
.map.up .t.low { filter: brightness(.55) saturate(.8); }
.map .t.low { transition: filter .35s; }

/* fire: flames while it burns, and a spark flying over a gap */
.t.fire::after { content: ""; position: absolute; inset: -10% 8% 4% 8%; z-index: 3; pointer-events: none;
  background: radial-gradient(ellipse at 50% 85%, #fff2a8 0 18%, #ffb347 19% 42%, #ff6a2a 43% 66%, transparent 68%);
  animation: flame .22s ease-in-out infinite alternate; filter: drop-shadow(0 0 6px #ff8a3c); }
@keyframes flame { from { transform: scaleY(1) translateY(0); } to { transform: scaleY(1.18) translateY(-6%); } }
.t.spark::after { content: ""; position: absolute; left: 30%; top: 30%; width: 22%; height: 22%; border-radius: 50%; z-index: 3;
  background: #ffd36a; box-shadow: 0 0 8px #ff9a3c, 10px -6px 0 -2px #ffb347, -8px -10px 0 -3px #ffd36a; animation: sparkfly .3s ease-out; }
@keyframes sparkfly { from { transform: translate(-40%, 20%) scale(.6); opacity: .4; } to { transform: translate(40%, -30%) scale(1); opacity: 1; } }
.t.chew { animation: chew .16s linear infinite; }
@keyframes chew { 50% { transform: translateX(6%) rotate(3deg); } }

/* a creature on the map */
.cr { position: absolute; inset: 6%; width: 88%; height: 88%; animation: bob 1.6s ease-in-out infinite; filter: drop-shadow(0 1px 0 rgba(0,0,0,.4)); z-index: 2; }
.cr.rare { filter: drop-shadow(0 0 4px var(--gold)); }
.cr.rarest { filter: drop-shadow(0 0 6px var(--ember)) drop-shadow(0 0 2px var(--gold)); }
/* a glint seen through the fog (followers and plain creatures only; rare ones never glint) */
.glint {
  position: absolute; left: 50%; top: 50%; width: 30%; height: 30%;
  transform: translate(-50%, -50%) rotate(45deg); background: var(--gold);
  border-radius: 2px; animation: twinkle 1.4s ease-in-out infinite;
}

/* a rare one's trail; each rare one leaves its own kind */
.trk { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.trk::before, .trk::after { content: ""; position: absolute; }
.trk.hoof::before, .trk.hoof::after { width: 14%; height: 20%; border-radius: 50% 50% 45% 45%; background: #3e2f1e; opacity: .8; box-shadow: 6px 0 0 #3e2f1e; }
.trk.hoof::before { left: 22%; top: 22%; } .trk.hoof::after { left: 52%; top: 56%; }
.trk.silver::before, .trk.silver::after { width: 14%; height: 20%; border-radius: 50% 50% 45% 45%; background: #dfe6f2; box-shadow: 6px 0 0 #dfe6f2, 0 0 6px #fff; }
.trk.silver::before { left: 22%; top: 22%; } .trk.silver::after { left: 52%; top: 56%; }
.trk.feather::before, .trk.feather::after { width: 32%; height: 10%; border-radius: 50% 0 50% 0; background: #f4f1ea; box-shadow: 0 0 3px rgba(255,255,255,.6); }
.trk.feather::before { left: 18%; top: 30%; transform: rotate(-20deg); } .trk.feather::after { left: 50%; top: 62%; transform: rotate(30deg); }
.trk.wet::before, .trk.wet::after { width: 18%; height: 14%; border-radius: 50%; background: rgba(150,200,240,.75); box-shadow: 5px -4px 0 -2px rgba(150,200,240,.75), -5px -4px 0 -2px rgba(150,200,240,.75); }
.trk.wet::before { left: 24%; top: 28%; } .trk.wet::after { left: 56%; top: 60%; }
.trk.dust::before, .trk.dust::after { width: 16%; height: 16%; border-radius: 50%; background: #ffd36a; box-shadow: 0 0 6px #ff9a3c; animation: twinkle2 2s ease-in-out infinite; }
.trk.dust::before { left: 24%; top: 40%; } .trk.dust::after { left: 60%; top: 24%; animation-delay: -1s; }
@keyframes twinkle2 { 50% { opacity: .4; } }

/* the "stuck" sign: never a word about what to do, just a bird circling at the spot */
.sign { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.t.signed { z-index: 4; }
.sign.bird .orbit, .sign.bird .shadow { position: absolute; left: 50%; top: 50%; width: 0; height: 0; animation: orbit 3.2s linear infinite; }
.sign.bird svg { position: absolute; left: calc(var(--tile) * .2); top: calc(var(--tile) * -1.1); width: calc(var(--tile) * .85); height: calc(var(--tile) * .85); overflow: visible; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
.sign.bird .shadow i { position: absolute; left: calc(var(--tile) * .65); top: calc(var(--tile) * -.15); width: calc(var(--tile) * .55); height: calc(var(--tile) * .2); border-radius: 50%; background: rgba(0,0,0,.35); }
.wing { transform-origin: 17px 18px; animation: flap .5s ease-in-out infinite alternate; }
.wing.r { animation-delay: -.5s; }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.35); } }
@keyframes orbit { to { transform: rotate(360deg); } }

/* squares that just changed */
.t.pulse > .ring {
  position: absolute; inset: 1px; border-radius: 4px; z-index: 3;
  box-shadow: inset 0 0 0 3px var(--gold); animation: pulse .7s ease-in-out 4; pointer-events: none;
}
@keyframes bob { 50% { transform: translateY(-7%); } }
@keyframes twinkle { 0%, 100% { opacity: .25; transform: translate(-50%,-50%) rotate(45deg) scale(.6); } 50% { opacity: 1; transform: translate(-50%,-50%) rotate(45deg) scale(1); } }
@keyframes pulse { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

/* you */
.me {
  position: absolute; left: 0; top: 0; width: var(--tile); height: var(--tile);
  pointer-events: none; transition: transform .11s linear; z-index: 5;
}
.me::after {
  content: ""; position: absolute; inset: 24%; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 0 3px var(--night), 0 0 0 5px var(--gold), 0 0 16px var(--gold);
}
.me.push::after { animation: shove .4s ease-out; }
@keyframes shove { 40% { transform: scale(1.25, .8); } }

/* your follower: on the square you just left; the cloud floats, and drifts off on its own */
.fol { position: absolute; left: 0; top: 0; width: var(--tile); height: var(--tile); z-index: 4; pointer-events: none;
  transition: transform .16s linear; }
.fol[hidden] { display: none; }
.fol svg { position: absolute; inset: 4%; width: 92%; height: 92%; overflow: visible; filter: drop-shadow(0 2px 0 rgba(0,0,0,.4)); }
.fol.left svg { transform: scaleX(-1); }
.fol.f-F svg { animation: trotf .3s ease-in-out infinite; }
.fol.f-F::after { content: ""; position: absolute; right: -6%; bottom: 10%; width: 34%; height: 34%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,200,90,.9), rgba(255,120,40,.0) 70%); animation: ember .4s ease-in-out infinite alternate; }
.fol.f-F.left::after { right: auto; left: -6%; }
@keyframes ember { from { opacity: .5; transform: scale(.8); } to { opacity: 1; transform: scale(1.2); } }
@keyframes trotf { 50% { transform: translateY(-5%); } }
.fol.left.f-F svg { animation-name: trotfL; }
@keyframes trotfL { 0%, 100% { transform: scaleX(-1); } 50% { transform: scaleX(-1) translateY(-5%); } }
.fol.f-G.gnaw svg { animation: gnaw .12s linear infinite; }
@keyframes gnaw { 50% { transform: translateY(-8%) rotate(-6deg); } }
.fol.f-D { z-index: 6; transition: transform .7s ease-in-out; }
.fol.f-D svg { inset: -30% -10% 40% -10%; width: 120%; height: 90%; animation: floaty 2.4s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(0,0,0,.25)); }
.fol.f-D::after { content: ""; position: absolute; left: 14%; right: 14%; top: 48%; bottom: -4%;
  background: repeating-linear-gradient(100deg, transparent 0 5px, rgba(170,210,255,.75) 5px 6px, transparent 6px 11px);
  background-size: 100% 12px; animation: rain .35s linear infinite; opacity: .9; }
@keyframes floaty { 50% { transform: translateY(-6%); } }
@keyframes rain { from { background-position: 0 0; } to { background-position: -3px 12px; } }

/* the wind: streaks moving across the whole view, the way it blows */
.windfx { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; transition: opacity 1.4s; overflow: hidden; }
.windfx.e, .windfx.w { opacity: 1; }
.windfx i { position: absolute; left: 0; width: 70px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, rgba(236,232,218,.55), transparent); }
.windfx.e i { animation: gustE 1.5s linear infinite; }
.windfx.w i { animation: gustW 1.5s linear infinite; }
.windfx i.leaf { width: 7px; height: 5px; border-radius: 60% 0; background: #8fbf5a; }
@keyframes gustE { from { transform: translateX(-90px); } to { transform: translateX(620px); } }
@keyframes gustW { from { transform: translateX(620px); } to { transform: translateX(-90px); } }

/* hint line */
.hint { min-height: 2.8em; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; color: var(--muted); font-size: 14px; padding: 0 4px; }
.hint.news { color: var(--ink); font-weight: 700; }
.hint svg { width: 28px; height: 28px; flex: none; }

/* creature book */
.book { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.book h2 { margin: 0 0 6px; font: 700 13px/1 var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; justify-content: space-between; }
.book h2 b { color: var(--ink); font-variant-numeric: tabular-nums; }
.slots { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px 2px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; background: none; border: 0; padding: 2px 0; color: inherit; font: inherit; cursor: pointer; }
.slot .face {
  position: relative; width: 28px; height: 28px; border-radius: 50%;
  border: 2px dashed var(--line); display: grid; place-items: center;
  color: var(--muted); font: 700 12px var(--f-display);
}
.slot.helper .face { border-color: #4a6a9a; }
.slot.rare .face { border-color: var(--gold); border-style: solid; }
.slot.rarest .face { border: 3px double var(--ember); }
.slot.got .face { border: 0; background: #2a3350; }
.slot.got.helper .face { box-shadow: 0 0 0 2px var(--helper); }
.slot.got.helper.out .face { box-shadow: 0 0 0 2px var(--helper), 0 0 0 4px var(--gold); }
.slot.got.rare .face { box-shadow: 0 0 0 2px var(--gold), 0 0 8px var(--gold); }
.slot.got.rarest .face { box-shadow: 0 0 0 2px var(--ember), 0 0 12px var(--ember); }
.slot .face svg { width: 24px; height: 24px; }
.slot .face .trk { position: absolute; inset: 0; }
.slot .nm { font-size: 9px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.got .nm { color: var(--ink); }
.slot.pop .face { animation: pop .5s ease-out; }
@keyframes pop { 40% { transform: scale(1.35); } }

/* found card; rare finds get a gold card, the rarest an ember one */
.card { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(8,10,18,.6); padding: 16px; }
.card[hidden] { display: none; }
.cardin {
  width: min(300px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 16px 14px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px;
  animation: cardin .3s ease-out;
}
.cardin.helper { border-color: var(--helper); }
.cardin.rare { border: 2px solid var(--gold); box-shadow: 0 0 32px rgba(242,193,78,.45); }
.cardin.rarest, .cardin.done { border: 2px solid var(--ember); box-shadow: 0 0 48px rgba(255,138,92,.6); animation: cardin .3s ease-out, glowcard 1.6s ease-in-out .3s infinite; }
.cardin > svg { width: 104px; height: 104px; }
.cardin.rare > svg, .cardin.rarest > svg { width: 124px; height: 124px; }
.cardin b { font: 700 24px/1.1 var(--f-display); }
.cardin .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--gold); font-weight: 700; }
.cardin.helper .tag { color: #9db8ea; }
.cardin.rarest .tag, .cardin.done .tag { color: var(--ember); font-size: 13px; }
.cardin p { margin: 0; font-size: 16px; }
.cardin small { color: var(--muted); margin-top: 6px; }
.cardin .crew { display: flex; gap: 10px; margin-top: 4px; }
.cardin .crew svg { width: 52px; height: 52px; background: #2a3350; border-radius: 50%; box-shadow: 0 0 0 2px var(--helper); }
@keyframes cardin { from { transform: scale(.85); opacity: 0; } }
@keyframes glowcard { 50% { box-shadow: 0 0 70px rgba(255,138,92,.85); } }

@media (prefers-reduced-motion: reduce) {
  .cr, .glint, .slot.pop .face, .t.pulse > .ring, .cardin, .trk::before, .trk::after,
  .sign.bird .orbit, .sign.bird .shadow, .wing, .g-water, .g-logw, .g-raised, .g-bridge,
  .me::after, .fol svg, .fol::after, .t.fire::after, .t.spark::after, .t.chew, .windfx i { animation: none; }
  .me, .map, .fol { transition: none; }
  .t.pulse > .ring { opacity: 1; }
}
</style>

// prev: the square you last stepped off; your follower stands there.
let S = null;

function ground(x, y) {

// What one push in a straight direction does from (x, y): walk, or bump into something.
function stepFrom(x, y, dx, dy) {

// ---- fire (Emberfox) ----
// Brambles next to the fox catch fire. Fire runs on downwind through brambles in a row, and when the wind blows,
// sparks fly over one square of anything low to the next dry thing. With no wind it only burns where it was lit.
// It never burns across a height change, the same height rule as everyone.

    const b = a + wind;
    if (!inside(b, y) || "txhV".includes(ga)) break;

// ---- rain (Drizzle) ----
// The cloud floats over the square you just left. When the wind blows, it gets blown DRIFT squares from you, downwind,

// ---- chewing (Gnawly) ----
// Walk into a lone tree and it gets chewed down. It falls away from you, FALL squares long, over grass, brambles,

// against the cliff and leans there, and you can walk up it.

    folEl.innerHTML = `<svg viewBox="0 0 32 32" aria-hidden="true"><use href="#sp-${k}"/></svg>`;
  }
  const at = k === "D" ? cloudSpot(windNow()) : S.prev;
  if (at !== folAt) {
    const [fx] = xy(at), [px] = xy(folAt < 0 ? at : folAt);
    if (fx !== px) folEl.classList.toggle("left", fx < px);
    folAt = at;
  }
  const [x, y] = xy(at);
  folEl.style.transform = `translate(calc(${x} * var(--tile)), calc(${y} * var(--tile)))`;
}

// ---- finding a creature ----
const cardEl = document.getElementById("card");
let afterCard = null;
function showCard(k) {
  const c = CREATURES[k];
  document.getElementById("cardIn").className = "cardin " + c.kind;
  document.getElementById("cardTag").textContent = TAG[c.kind];
  document.getElementById("cardUse").parentNode.style.display = "";
  document.getElementById("cardUse").setAttribute("href", "#sp-" + k);
  document.getElementById("cardName").textContent = c.name;
  document.getElementById("cardLine").textContent = c.line;
  document.getElementById("cardCrew").hidden = true;
  document.getElementById("cardSmall").textContent = "Tap to keep exploring";
  cardEl.hidden = false;
}
// the end of the map: what comes next, and who comes with you
function showDone() {
  document.getElementById("cardIn").className = "cardin done";
  document.getElementById("cardTag").textContent = "Map 1 done";
  document.getElementById("cardUse").parentNode.style.display = "none";
  document.getElementById("cardName").textContent = "See you tomorrow";
  document.getElementById("cardLine").textContent = "Map 2 arrives tomorrow. These followers come with you:";
  const crew = document.getElementById("cardCrew");
  crew.innerHTML = FOLLOW.filter((k) => S.found.includes(k)).map((k) => art(k)).join("");
  crew.hidden = false;
  document.getElementById("cardSmall").textContent = "Tap to close";
  cardEl.hidden = false;
}
function closeCard() {
  cardEl.hidden = true;
  if (afterCard) { const f = afterCard; afterCard = null; f(); }
  draw();
  pump();
}
cardEl.addEventListener("click", closeCard);
function find(k) {
  S.found.push(k);
  quietSince = Date.now();
  if (CREATURES[k].kind === "helper") { S.out = k; S.prev = idx(S.x, S.y); }
  look();
  const el = slotEls[k];
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  draw(); save();
  showCard(k);
  afterCard = () => {
    const c = CREATURES[k];
    if (S.found.length === ORDER.length) { say("Every creature on map 1 found.", true); setTimeout(showDone, 50); }
    else if (c.kind === "helper") say(c.after, true, k);
    else if (c.kind === "rarest") say(`The rarest one: ${c.name}!`, true, k);
    else if (c.kind === "rare") say(`A rare find: ${c.name}!`, true, k);
    else say(`You found ${c.name}!`, true, k);
  };
}

// ---- moving ----
const SLOW = matchMedia("(prefers-reduced-motion: reduce)").matches;
const T = SLOW ? { step: 50, fireStep: 120, burn: 500, chew: 400 }
               : { step: 115, fireStep: 260, burn: 1300, chew: 1100 };
let walk = null, busy = false, moving = false;
const later = (f, ms) => { walk = setTimeout(f, ms); };
// plays out a list of steps; done(stopped) runs at the end; stopped means a find or a rare one cut it short
function go(steps, done = () => {}) {
  if (walk) clearTimeout(walk);
  const arrive = () => {
    const i = idx(S.x, S.y);
    const news = look();
    const k = creatureAt(S.x, S.y);
    if (k && !S.found.includes(k) && findable(k, i)) { walk = null; find(k); done(true); return true; }
    draw();
    tell(news);
    if (!news.met && !news.trail && ground(S.x, S.y) === "s") say("A seed, in a patch of soft dark earth.", false);
    save();
    if (news.met) { walk = null; done(true); return true; }  // stop so you see a rare one before you walk off
    return false;
  };
  const tick = () => {
    if (!steps.length) { walk = null; save(); done(false); return; }
    const { i } = steps.shift();
    const [nx, ny] = xy(i);
    S.prev = idx(S.x, S.y);
    S.x = nx; S.y = ny;
    if (arrive()) return;
    later(tick, T.step);
  };
  tick();
}

// ---- fire: the fox sets brambles next to it alight; the wind carries it on ----
const lit = new Set();
function ignite(n) {
  const path = fireFrom(n, windNow()).filter((i) => !lit.has(i));
  path.forEach((i, k) => {
    lit.add(i);
    setTimeout(() => {
      const [x, y] = xy(i);
      if (!burns(ground(x, y))) { lit.delete(i); return; }
      const prev = k > 0 ? path[k - 1] : -1;
      if (prev >= 0 && Math.abs(xy(prev)[0] - x) === 2) {   // a spark flies over the square between
        const gap = idx((xy(prev)[0] + x) / 2, y);
        SPARKS.add(gap); setTimeout(() => { SPARKS.delete(gap); draw(); }, 320);
      }
      HOT.add(i); S.seen[i] = 1; draw();
      setTimeout(() => {
        HOT.delete(i); lit.delete(i);
        const wasPost = ground(x, y) === "Y";
        Object.assign(S.mod, burnt(i));
        if (wasPost) { for (const z of ZS) S.seen[z] = 1; flash(ZS.concat([i])); say("The rope burns through, and the bridge drops across the river.", true); }
        look(); draw(); save();
      }, T.burn);
    }, k * T.fireStep);
  });
}
setInterval(() => {
  if (S.out !== "F" || !cardEl.hidden) return;
  for (const n of lightable(S.prev)) if (!lit.has(n)) ignite(n);
}, 150);

// ---- rain: the cloud waters whatever is under it ----
const GROW_SAY = { w: "The sprout drinks the rain and climbs the cliff.", s: "The seed drinks the rain and shoots up into a tree.",
  S: "The stump sprouts back into a tree." };
setInterval(() => {
  drawWind();
  if (S.out === "D") placeFollower();
  if (S.out !== "D" || !cardEl.hidden) return;
  const c = cloudSpot(windNow()), was = ground(...xy(c)), g = rainOn(c);
  if (!g) return;
  S.mod[c] = g; S.seen[c] = 1;
  if (g === "T" && mapGround(...xy(c)) === "T") delete S.mod[c];
  look(); flash([c]); save();
  say(g === "w" ? GROW_SAY.w : GROW_SAY[was], true);
}, 200);

// ---- chewing: walk into a lone tree with Gnawly following ----
function chew(tx, ty, dx, dy) {
  busy = true;
  const ti = idx(tx, ty);
  chewing = ti; folEl.classList.add("gnaw");
  say("Gnawly gets to work on the tree.", false);
  draw();
  setTimeout(() => {
    chewing = -1; folEl.classList.remove("gnaw");
    if (ground(tx, ty) !== "T") { busy = false; draw(); return; }
    const res = fall(tx, ty, dx, dy);
    Object.assign(S.mod, res.ch);
    for (const i of res.logs) S.seen[i] = 1;
    flash([ti, ...res.logs]);
    say(res.lean ? "Timber! The tree falls against the cliff." : "Timber! The tree comes down.", true);
    look(); draw(); save();
    busy = false; needRelease = !!inputVec();   // still holding on: stop until you let go; already let go: free to walk
  }, T.chew);
}

// ---- the controls: a thumb stick on the map (phone or mouse), or arrow keys / WASD ----
// One step at a time while you hold it. After a find or a rare one, you stop until you let go.
const stickEl = document.getElementById("stick"), knobEl = document.getElementById("knob");
const STICK_R = 40, DEAD = 12;
let stick = null, needRelease = false, acc = { x: 0, y: 0 }, lastBump = "";
const keys = new Set();
const KEY_DIR = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
                  KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0] };
function inputVec() {
  if (stick) return Math.hypot(stick.vx, stick.vy) > DEAD ? { x: stick.vx, y: stick.vy } : null;
  let x = 0, y = 0;
  for (const c of keys) { x += KEY_DIR[c][0]; y += KEY_DIR[c][1]; }
  return x || y ? { x, y } : null;
}
function inputChanged() {
  if (!inputVec()) { needRelease = false; acc = { x: 0, y: 0 }; lastBump = ""; }
  pump();
}
function finish(stop) {
  moving = false;
  if (stop) needRelease = true;
  draw();
  pump();
}
function bump(a) {
  meEl.classList.remove("push"); void meEl.offsetWidth; meEl.classList.add("push");
  if (a.g === "T" && S.out === "G" && !a.edge) {
    const t = chewTarget(S.x, S.y, a.dx, a.dy);
    if (t) { lastBump = ""; chew(t[0], t[1], a.dx, a.dy); return; }
  }
  const tx = S.x + a.dx, ty = S.y + a.dy, tk = inside(tx, ty) && TRACK.get(idx(tx, ty));
  const onTrail = tk && trailShows(tk, tx, ty);
  const hot = inside(tx, ty) && HOT.has(idx(tx, ty));
  const text = hot ? "Too hot. It's burning." : a.edge ? "A steep cliff." : (BLOCKED_HINT[a.g] || "You can't go there.") + (onTrail ? " The trail goes on in there." : "");
  if (text !== lastBump) { say(text, false); lastBump = text; }
  moving = true;
  draw();
  setTimeout(() => finish(false), 220);
}
function pump() {
  if (moving || busy || !cardEl.hidden || needRelease) return;
  const v = inputVec();
  if (!v) return;
  const ax = Math.abs(v.x), ay = Math.abs(v.y), sx = Math.sign(v.x), sy = Math.sign(v.y);
  // nearly straight: one axis only. At a slant: a staircase that keeps close to the line you're holding.
  const slant = Math.min(ax, ay) / Math.max(ax, ay) > 0.414;
  let tries;
  if (!slant) tries = ax >= ay ? [[sx, 0]] : [[0, sy]];
  else {
    acc.x = Math.min(2, acc.x + ax / (ax + ay)); acc.y = Math.min(2, acc.y + ay / (ax + ay));
    tries = acc.x >= acc.y ? [[sx, 0], [0, sy]] : [[0, sy], [sx, 0]];
  }
  let first = null;
  for (const [dx, dy] of tries) {
    const a = stepFrom(S.x, S.y, dx, dy);
    if (a.kind !== "bump") {
      if (dx) acc.x -= 1; else acc.y -= 1;
      S.face = [dx, dy];
      lastBump = ""; moving = true;
      go([{ i: a.to }], finish);
      return;
    }
    if (!first) first = { ...a, dx, dy };
  }
  S.face = [first.dx, first.dy];
  bump(first);
}
setInterval(pump, 40);

viewEl.addEventListener("pointerdown", (e) => {
  if (stick || (e.pointerType === "mouse" && e.button !== 0)) return;
  const r = viewEl.getBoundingClientRect();
  stick = { id: e.pointerId, ox: e.clientX - r.left, oy: e.clientY - r.top, vx: 0, vy: 0 };
  try { viewEl.setPointerCapture(e.pointerId); } catch (err) { /* fine without it */ }
  stickEl.style.left = stick.ox + "px"; stickEl.style.top = stick.oy + "px";
  knobEl.style.transform = "";
  stickEl.hidden = false;
  e.preventDefault();
});
viewEl.addEventListener("pointermove", (e) => {
  if (!stick || e.pointerId !== stick.id) return;
  const r = viewEl.getBoundingClientRect();
  let dx = e.clientX - r.left - stick.ox, dy = e.clientY - r.top - stick.oy;
  const len = Math.hypot(dx, dy);
  if (len > STICK_R) { dx *= STICK_R / len; dy *= STICK_R / len; }
  knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
  stick.vx = dx; stick.vy = dy;
  inputChanged();
});
const letGo = (e) => {
  if (!stick || e.pointerId !== stick.id) return;
  stick = null; stickEl.hidden = true;
  inputChanged();
};
viewEl.addEventListener("pointerup", letGo);
viewEl.addEventListener("pointercancel", letGo);
addEventListener("keydown", (e) => {
  if (!cardEl.hidden && ["Enter", "Space", "Escape"].includes(e.code)) { e.preventDefault(); closeCard(); return; }
  if (e.code === "KeyF" || e.code === "Tab") { e.preventDefault(); whoEl.click(); return; }
  if (!KEY_DIR[e.code] || e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();
  if (!keys.has(e.code)) { keys.add(e.code); inputChanged(); }
});
addEventListener("keyup", (e) => { if (keys.delete(e.code)) inputChanged(); });
addEventListener("blur", () => { keys.clear(); stick = null; stickEl.hidden = true; inputChanged(); });

// ---- stuck: after a long while with no new find, one unsolved spot shows a sign ----
let STUCK_MS = 150000, quietSince = Date.now();
setInterval(() => {
  if (sign && !sign.want()) { sign = null; draw(); }
  if (sign || !cardEl.hidden || Date.now() - quietSince < STUCK_MS) return;
  const s = SIGNS.find((s) => s.want() && S.seen[idx(...s.at)]);
  if (!s) return;
  sign = s; quietSince = Date.now();
  draw(); say(s.line, true);
}, 3000);

// ---- start over (tap twice) ----
const resetBtn = document.getElementById("reset");
let armed = null;
resetBtn.addEventListener("click", () => {
  if (!armed) {
    resetBtn.classList.add("armed"); resetBtn.textContent = "Tap again to wipe";
    armed = setTimeout(() => { armed = null; resetBtn.classList.remove("armed"); resetBtn.textContent = "Start over"; }, 3000);
    return;
  }
  clearTimeout(armed); armed = null;
  resetBtn.classList.remove("armed"); resetBtn.textContent = "Start over";
  if (busy || HOT.size) return;
  if (walk) clearTimeout(walk);
  walk = null; pulsing = new Set(); sign = null;
  moving = false; needRelease = false;
  S = fresh(); quietSince = Date.now(); look(); draw(); save();
  say("Drag anywhere on the map to walk. On a computer, use the arrow keys.", false);
});

// ---- go ----
// For checking only, never saved:
//   #peek        the whole map, all three followers, Emberfox out; the stuck sign comes after 6 seconds; the wind runs as normal
//   #peek-calm   the same, with the wind held still     #peek-east / #peek-west  the same, with the wind held blowing that way
//   add @x,y to stand somewhere else, and ~K to pick who follows (F, G or D), e.g. #peek-east@23,11~D
if (location.hash.startsWith("#peek")) {
  saving = false; STUCK_MS = 6000;
  S.seen.fill(1); S.found = ["F", "G", "D"]; S.out = "F";
  if (location.hash.startsWith("#peek-calm")) windFrozen = 0;
  if (location.hash.startsWith("#peek-east")) windFrozen = 1;
  if (location.hash.startsWith("#peek-west")) windFrozen = -1;
  const at = location.hash.match(/@(\d+),(\d+)/);
  if (at) { S.x = +at[1]; S.y = +at[2]; }
  const who = location.hash.match(/~([FGD])/);
  if (who) S.out = who[1];
  S.prev = idx(S.x, Math.min(H - 1, S.y + 1));
} else {
  load();
}
look();
draw();
fit();
</script>
