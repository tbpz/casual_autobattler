<title>Fog Map Sketch 6</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one portrait column. "Found" meter on top, a scrolling fogged map in the middle that follows you,
   hint line and creature book below. A card pops up when you find a creature. Night-time look on purpose.
   Sketch 6: five helpers, and the world reacts to them. A boulder rolls until it hits something (and can dam
   a river), fast water carries you, anything high lets you glide. Every rare one needs an idea, not a key. */
:root {
  color-scheme: dark;
  --night: #121726;
  --panel: #1b2236;
  --line: #2c3550;
  --ink: #ece8da;
  --muted: #9aa1b8;
  --gold: #f2c14e;
  --ember: #ff8a5c;
  --helper: #6c8fd0;
  --fog: #232a42;
  --fog-2: #272f4a;
  --grass: #4c7744;
  --grass-2: #527d49;
  --high: #6f9b5c;
  --high-2: #77a363;
  --tree: #2c4d30;
  --tree-top: #3b6640;
  --water: #36689c;
  --water-2: #4479ae;
  --rock: #6f7380;
  --rock-2: #858a97;
  --stone: #2a2e3b;
  --stone-2: #323747;
  --chasm: #0d0f18;
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tile: 30px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font: 15px/1.4 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; }
.score { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.score b { font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.score small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.meter { height: 4px; width: 84px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }
.spacer { flex: 1; }
.btn {
  font: 600 12px var(--f-body); color: var(--muted); background: none;
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
.btn.on { color: var(--night); background: var(--gold); border-color: var(--gold); }
.btn.armed { color: var(--night); background: #e07a5f; border-color: #e07a5f; }
.btn:focus-visible, .slot:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* map view: the map slides inside it so you stay near the middle */
.view { flex: 1; min-height: 0; position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); background: var(--fog); }
.map {
  position: absolute; left: 0; top: 0; display: grid;
  grid-auto-rows: var(--tile);
  transition: transform .28s ease-out;
  touch-action: none; user-select: none;
}
.view { touch-action: none; user-select: none; -webkit-user-select: none; }
.t { position: relative; }
/* the thumb stick: shows up where your thumb lands on the map, follows it, goes when you let go */
.stick {
  position: absolute; width: 92px; height: 92px; margin: -46px 0 0 -46px; z-index: 5; pointer-events: none;
  border-radius: 50%; border: 2px solid rgba(236,232,218,.38); background: rgba(18,23,38,.42);
}
.stick[hidden] { display: none; }
.stick i {
  position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%;
  background: rgba(242,193,78,.9); box-shadow: 0 0 0 3px rgba(18,23,38,.5), 0 0 14px rgba(242,193,78,.55);
}
.fog { background: var(--fog); }
.fog.alt { background: var(--fog-2); }
.g-grass { background: var(--grass); }
.g-grass.alt { background: var(--grass-2); }
.g-tree { background: radial-gradient(circle at 50% 45%, var(--tree-top) 0 42%, transparent 44%), var(--tree); }
.g-water { background: repeating-linear-gradient(170deg, var(--water) 0 5px, var(--water-2) 5px 7px); }
.g-rock { background: linear-gradient(180deg, var(--rock-2) 0 18%, var(--rock) 18% 82%, #5d616d 82%); }
.g-stone { background: linear-gradient(135deg, var(--stone-2) 0 22%, var(--stone) 22% 78%, var(--stone-2) 78%); }
.g-chasm { background: linear-gradient(90deg, #1e2230, var(--chasm) 30% 70%, #1e2230); }
.g-high { background: var(--high); }
.g-high.alt { background: var(--high-2); }
.g-high.edge { box-shadow: inset 0 -7px 0 #3c5a33, inset 0 -9px 0 #2a3f24; }
.g-ramp { background: repeating-linear-gradient(0deg, #9a9478 0 5px, #7d775f 5px 8px); }
.g-soil { background:
  radial-gradient(circle at 30% 35%, #8fce7a 0 6%, transparent 7%),
  radial-gradient(circle at 68% 62%, #8fce7a 0 6%, transparent 7%),
  repeating-linear-gradient(0deg, #6b4a2e 0 4px, #5a3d25 4px 7px); }
.g-hole { background: radial-gradient(ellipse 34% 26% at 50% 56%, #070605 0 85%, #3a2a1a 92%, transparent 100%), var(--grass); }
.g-boulder { background: radial-gradient(circle at 42% 38%, #c8cbd2 0 12%, #8e929d 14% 40%, #5d616c 41% 44%, transparent 46%), var(--grass); }
.g-bridge { background: radial-gradient(circle at 46% 44%, #9da1ab 0 10%, #7a7e88 12% 44%, transparent 47%), linear-gradient(90deg, #1e2230, var(--chasm) 30% 70%, #1e2230); }
/* a sunken hollow: steep sides, a dark floor */
.g-hollow { background: radial-gradient(ellipse at 50% 55%, #241f16 0 45%, #3b3223 80%), #1c1810; box-shadow: inset 0 7px 8px rgba(0,0,0,.65); }
/* a riverbed run dry: sand and pebbles */
.g-dry { background:
  radial-gradient(circle at 28% 34%, #c2ad84 0 7%, transparent 8%),
  radial-gradient(circle at 70% 68%, #a8926a 0 6%, transparent 7%),
  radial-gradient(circle at 62% 22%, #7c6a4c 0 5%, transparent 6%), #8d7958; }
/* a boulder sitting in water: in a pond, or across a river as a dam */
.g-step, .g-dam { background: radial-gradient(circle at 46% 44%, #b4b8c1 0 10%, #848893 12% 40%, #5d616c 41% 44%, transparent 46%), repeating-linear-gradient(170deg, var(--water) 0 5px, var(--water-2) 5px 7px); }
/* fast water: stripes run the way it flows */
.g-river { background: repeating-linear-gradient(0deg, #2f7fb8 0 6px, #6cb6e6 6px 8px, #2f7fb8 8px 14px); background-size: 100% 14px; animation: flowdown .45s linear infinite; }
.g-river.left, .g-river.right { background: repeating-linear-gradient(90deg, #2f7fb8 0 6px, #6cb6e6 6px 8px, #2f7fb8 8px 14px); background-size: 14px 100%; animation: flowleft .45s linear infinite; }
.g-river.right { animation-name: flowright; }
@keyframes flowdown { from { background-position: 0 0; } to { background-position: 0 14px; } }
@keyframes flowleft { from { background-position: 0 0; } to { background-position: -14px 0; } }
@keyframes flowright { from { background-position: 0 0; } to { background-position: 14px 0; } }
/* a grown vine up a cliff */
.g-vine { background: linear-gradient(180deg, var(--rock-2) 0 18%, var(--rock) 18% 82%, #5d616d 82%); }
.g-vine::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 18% 12% at 30% 30%, #7fd06a 0 90%, transparent 100%),
    radial-gradient(ellipse 18% 12% at 70% 62%, #7fd06a 0 90%, transparent 100%),
    radial-gradient(ellipse 16% 11% at 32% 86%, #7fd06a 0 90%, transparent 100%),
    linear-gradient(90deg, transparent 42%, #3f9a3c 42% 58%, transparent 58%);
}
.g-vine.grow::before { animation: grow .7s ease-out var(--d, 0s) both; }
@keyframes grow { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }

/* a creature on the map */
.cr { position: absolute; inset: 6%; width: 88%; height: 88%; animation: bob 1.6s ease-in-out infinite; filter: drop-shadow(0 1px 0 rgba(0,0,0,.4)); }
.cr.rare { filter: drop-shadow(0 0 4px var(--gold)); }
.cr.rarest { filter: drop-shadow(0 0 6px var(--ember)) drop-shadow(0 0 2px var(--gold)); }
/* a glint seen through the fog (helpers and plain creatures only; rare ones never glint) */
.glint {
  position: absolute; left: 50%; top: 50%; width: 30%; height: 30%;
  transform: translate(-50%, -50%) rotate(45deg); background: var(--gold);
  border-radius: 2px; animation: twinkle 1.4s ease-in-out infinite;
}

/* a rare one's trail; each rare one leaves its own kind */
.trk { position: absolute; inset: 0; pointer-events: none; }
.trk::before, .trk::after { content: ""; position: absolute; }
.trk.hoof::before, .trk.hoof::after { width: 16%; height: 22%; border-radius: 50% 50% 45% 45%; background: #ead9b0; opacity: .85; }
.trk.hoof::before { left: 26%; top: 22%; } .trk.hoof::after { left: 56%; top: 54%; }
.trk.crumb::before, .trk.crumb::after { width: 13%; height: 13%; background: #c9a8ff; transform: rotate(45deg); box-shadow: 0 0 4px #a77be0; }
.trk.crumb::before { left: 26%; top: 42%; } .trk.crumb::after { left: 60%; top: 28%; }
.trk.slime::before { left: 16%; top: 42%; width: 68%; height: 16%; border-radius: 8px; background: rgba(140,240,225,.55); box-shadow: 0 0 5px rgba(140,240,225,.6); }
.trk.ember::before, .trk.ember::after { width: 15%; height: 15%; border-radius: 50%; background: #ff9a6a; box-shadow: 0 0 8px #ff6a3a; animation: drift 2.4s ease-in-out infinite; }
.trk.ember::before { left: 26%; top: 52%; } .trk.ember::after { left: 58%; top: 28%; animation-delay: -1.2s; }
@keyframes drift { 50% { transform: translateY(-40%); opacity: .35; } }

/* the "stuck" signs: never a word about which helper, just something alive at the spot */
.sign { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.sign.bird::before {
  content: ""; position: absolute; left: 32%; top: -30%; width: 36%; height: 18%;
  border: 2px solid #f4ead6; border-bottom: 0; border-radius: 50% 50% 0 0;
  transform-origin: 50% 380%; animation: orbit 2.6s linear infinite;
}
.sign.fish::before {
  content: ""; position: absolute; left: 37%; top: 42%; width: 28%; height: 16%;
  background: #f0a35e; border-radius: 50%; box-shadow: 0 0 6px #f0a35e;
  animation: leap 1.5s ease-in-out infinite;
}
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes leap {
  0%, 100% { transform: translate(-70%, 60%) rotate(-40deg); opacity: 0; }
  20% { opacity: 1; }
  50% { transform: translate(0, -110%) rotate(0); opacity: 1; }
  80% { transform: translate(70%, 60%) rotate(40deg); opacity: 1; }
}

/* squares that just changed */
.t.pulse::after {
  content: ""; position: absolute; inset: 1px; border-radius: 4px;
  box-shadow: inset 0 0 0 3px var(--gold); animation: pulse .7s ease-in-out 4; pointer-events: none;
}
@keyframes bob { 50% { transform: translateY(-7%); } }
@keyframes twinkle { 0%, 100% { opacity: .25; transform: translate(-50%,-50%) rotate(45deg) scale(.6); } 50% { opacity: 1; transform: translate(-50%,-50%) rotate(45deg) scale(1); } }
@keyframes pulse { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

/* you */
.me {
  position: absolute; left: 0; top: 0; width: var(--tile); height: var(--tile);
  pointer-events: none; transition: transform .11s linear; z-index: 3;
}
.me::after {
  content: ""; position: absolute; inset: 24%; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 0 3px var(--night), 0 0 0 5px var(--gold), 0 0 16px var(--gold);
}
.me::before {
  content: ""; position: absolute; left: 22%; right: 22%; bottom: 8%; height: 16%; border-radius: 50%;
  background: rgba(0,0,0,.45); opacity: 0;
}
.me.glide { transition: transform .75s cubic-bezier(.35,.1,.45,1); }
.me.glide::after { animation: glide .75s ease-in-out; }
.me.glide::before { animation: shadow .75s ease-in-out; }
@keyframes glide { 0% { transform: none; } 25% { transform: translateY(-55%) scale(1.5); } 100% { transform: none; } }
@keyframes shadow { 0%, 100% { opacity: 0; } 25%, 85% { opacity: 1; } }
.me.swept { transition: transform .075s linear; }
.me.swept::after { background: #cdeeff; box-shadow: 0 0 0 3px #2f7fb8, 0 0 0 5px #cdeeff, 0 0 14px #cdeeff; animation: wobble .3s ease-in-out infinite; }
@keyframes wobble { 50% { transform: rotate(18deg) scale(.9); } }
.me.swim::after { background: #cdeeff; }
.me.jump { transition: none; }
.me.sink::after { animation: sink .3s ease-in forwards; }
.me.rise::after { animation: rise .32s ease-out; }
@keyframes sink { to { transform: scale(0); opacity: 0; } }
@keyframes rise { from { transform: scale(0) translateY(40%); opacity: 0; } }
.me.push::after { animation: shove .4s ease-out; }
@keyframes shove { 40% { transform: scale(1.25, .8); } }
/* a boulder on the move */
.rolling {
  position: absolute; width: var(--tile); height: var(--tile); z-index: 2; pointer-events: none;
  background: radial-gradient(circle at 42% 38%, #c8cbd2 0 12%, #8e929d 14% 40%, #5d616c 41% 44%, transparent 46%);
}
.rolling.spin { animation: spin .4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* hint line */
.hint { min-height: 2.8em; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; color: var(--muted); font-size: 14px; padding: 0 4px; }
.hint.news { color: var(--ink); font-weight: 700; }
.hint svg { width: 28px; height: 28px; flex: none; }

/* creature book */
.book { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.book h2 { margin: 0 0 6px; font: 700 13px/1 var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; justify-content: space-between; }
.book h2 b { color: var(--ink); font-variant-numeric: tabular-nums; }
.slots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px 2px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; background: none; border: 0; padding: 2px 0; color: inherit; font: inherit; cursor: pointer; }
.slot .face {
  position: relative; width: 30px; height: 30px; border-radius: 50%;
  border: 2px dashed var(--line); display: grid; place-items: center;
  color: var(--muted); font: 700 13px var(--f-display);
}
.slot.helper .face { border-color: #4a6a9a; }
.slot.rare .face { border-color: var(--gold); border-style: solid; }
.slot.rarest .face { border: 3px double var(--ember); }
.slot.got .face { border: 0; background: #2a3350; }
.slot.got.helper .face { box-shadow: 0 0 0 2px var(--helper); }
.slot.got.rare .face { box-shadow: 0 0 0 2px var(--gold), 0 0 8px var(--gold); }
.slot.got.rarest .face { box-shadow: 0 0 0 2px var(--ember), 0 0 12px var(--ember); }
.slot .face svg { width: 26px; height: 26px; }
.slot .nm { font-size: 9px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.got .nm { color: var(--ink); }
.slot.pop .face { animation: pop .5s ease-out; }
@keyframes pop { 40% { transform: scale(1.35); } }

/* found card; rare finds get a gold card, the rarest an ember one */
.card { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(8,10,18,.6); padding: 16px; }
.card[hidden] { display: none; }
.cardin {
  width: min(300px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 16px 14px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px;
  animation: cardin .3s ease-out;
}
.cardin.helper { border-color: var(--helper); }
.cardin.rare { border: 2px solid var(--gold); box-shadow: 0 0 32px rgba(242,193,78,.45); }
.cardin.rarest { border: 2px solid var(--ember); box-shadow: 0 0 48px rgba(255,138,92,.6); animation: cardin .3s ease-out, glowcard 1.6s ease-in-out .3s infinite; }
.cardin svg { width: 104px; height: 104px; }
.cardin.rare svg, .cardin.rarest svg { width: 124px; height: 124px; }
.cardin b { font: 700 24px/1.1 var(--f-display); }
.cardin .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--gold); font-weight: 700; }
.cardin.helper .tag { color: #9db8ea; }
.cardin.rarest .tag { color: var(--ember); font-size: 13px; }
.cardin p { margin: 0; font-size: 16px; }
.cardin small { color: var(--muted); margin-top: 6px; }
@keyframes cardin { from { transform: scale(.85); opacity: 0; } }
@keyframes glowcard { 50% { box-shadow: 0 0 70px rgba(255,138,92,.85); } }

@media (prefers-reduced-motion: reduce) {
  .cr, .glint, .slot.pop .face, .t.pulse::after, .cardin, .trk::before, .trk::after, .sign::before,
  .g-river, .g-vine.grow::before, .me::after, .me::before, .rolling.spin { animation: none; }
  .me, .map { transition: none; }
  .t.pulse::after { opacity: 1; }
}
</style>

<script>
// ==== CORE START: the rules of the world. No page code in here; check-map6.js runs this block too. ====

// ---- The map, placed by hand. 28 wide, 39 tall. ----
// .  grass        t  trees (never)        x  solid rock (never)       ~  still water (swim)
// =  fast water: step in and it carries you to where it ends (rivers below)
// u  a sunken hollow: too steep to climb into; fills with water if its river is dammed below it
// h  high ground (see further, glide down); walk on and off it only by a ramp /
// ^  sheer cliff (a vine grows up it from soft soil s)     v  deep crack
// O  a hole (burrow from one to another)    o  a boulder's starting spot    @  start
// letters = creatures; a creature's "on" says what ground it sits on
const MAP = [
  "tttttttttttttttttttttttttttt",
  "t~~~~~ttxxxxxttttttthhhhhhht",
  "t~~~~~ttxObxxttttttthhhhLhht",
  "t~~~~~ttxxxxxttttttthhdhhhht",
  "t~~~~~ttxxxxx.......hhhhhhht",
  "ttx=xxx.............hhhhhhht",
  "ttx=uuu.............hhhhhhht",
  "ttx=ueu........K..../hhhhhht",
  "ttx=uuu.............tttttttt",
  "ttx=................tt....=t",
  "ttx=..o......O......tt.n..=t",
  "ttx=.............P..tt....=t",
  "ttx=................tt....=t",
  "ttx=x^^^^^^^^^^^^^^^^^xxxx=t",
  "ttxDx^^^^^^^^^^^^^^^^^xxxx=t",
  "ttx=x......s....t...tttttt=t",
  "ttx=x..O........t.m.====tt=t",
  "ttx=x.U.........t...ttt=tt=t",
  "tt..............ttttttt=tt=t",
  "t.............^^ttttttt=tt=t",
  "ttttt.........^^ttttttt=tt=t",
  "ttttt.....@...s.ttttttt=tt=t",
  "ttttt.a.........tttORtt=tt=t",
  "ttttt...........ttttttt=tt=t",
  "ttttt....o......ttttttt=tt=t",
  "ttttt...........ttttttt=tt=t",
  "tttttvvvvvvvvvvvttttttt=tt=t",
  "ttttt............tttttt=tt=t",
  "ttttt.......S....tttttt=tt=t",
  "ttttt............tttttt=tt=t",
  "ttttt............=======tt=t",
  "ttttt.~~~~.......ttttttttt=t",
  "ttttt.~~~~.......ttttttttt=t",
  "ttttt.~.c~.......==========t",
  "ttttt.~~~~.......ttttttttttt",
  "ttttt.~~~~.......ttttttttttt",
  "ttttt............ttttttttttt",
  "ttttt............ttttttttttt",
  "tttttttttttttttttttttttttttt",
];
// END MAP

// a straight run of squares from a to b, both ends included
function line([ax, ay], [bx, by]) {
  const out = [], n = Math.max(Math.abs(bx - ax), Math.abs(by - ay));
  for (let k = 0; k <= n; k++) out.push([ax + Math.sign(bx - ax) * k, ay + Math.sign(by - ay) * k]);
  return out;
}
// Fast water, upstream first. Step in anywhere and it carries you down to "exit".
// A boulder rolled into it dams it there: above the dam the water goes still, below it the bed runs dry.
// "fill": squares that flood when the river is dammed below its "below"-th square.
const RIVERS = [
  { path: line([3, 5], [3, 17]), exit: [3, 18], fill: { below: 3, squares: [] } },
  { path: [...line([26, 9], [26, 33]), ...line([25, 33], [17, 33])], exit: [16, 33] },
  { path: [...line([20, 16], [23, 16]), ...line([23, 17], [23, 30]), ...line([22, 30], [17, 30])], exit: [16, 30] },
];
// A vine grows from the soft soil up these cliff squares, bottom first, and stays.
// "top": the last square is a lookout, high like high ground: you see far from it and can glide off it.
const VINES = [
  { soil: [11, 15], up: [[11, 14], [11, 13]] },
  { soil: [14, 21], up: [[14, 20], [14, 19]], top: true },
];

const SEE = 10;        // squared distance you can see clearly
const SEE_HIGH = 34;   // squared distance you can see from anywhere high
const GLIDE = 30;      // squared distance you can glide down from anywhere high
const GLINT = 26;      // squared distance a creature glints through the fog (never a rare one)
const MEET = 2;        // squared distance a rare one shows itself: right next to you

// kind: helper / plain / rare / rarest.
// after: what the hint line says once a helper's card closes.
// Walls never say which helper they need, and the book never says where anything is.
const CREATURES = {
  U: { name: "Shover",   kind: "helper", gives: "push",
       line: "Shoves big boulders. A boulder rolls away from you until it hits something.",
       after: "You can shove boulders now. Walk into one." },
  S: { name: "Sprout",   kind: "helper", gives: "vine",
       line: "Grows a vine up a cliff from soft soil. The vine stays.",
       after: "You can grow vines now. Stand on soft soil and walk into the cliff." },
  L: { name: "Glider",   kind: "helper", gives: "glide", on: "h",
       line: "Glides down from up high, over anything below.",
       after: "You can glide now. From up high, keep walking off the edge." },
  P: { name: "Paddler",  kind: "helper", gives: "swim",
       line: "Swims across still water.",
       after: "You can swim now." },
  K: { name: "Wormkin",  kind: "helper", gives: "burrow",
       line: "Dives into a hole and comes up out of another one you've seen, the way it was heading.",
       after: "You can burrow now. Walk into a hole: you come up out of the one that lies the way you were going." },
  a: { name: "Mossling", kind: "plain", line: "Soft, and a bit damp." },
  d: { name: "Pebblet",  kind: "plain", on: "h", line: "It sits up high and watches the meadow." },
  c: { name: "Shellbug", kind: "plain", line: "Slow, but it got out to the island somehow." },
  b: { name: "Puffcap",  kind: "plain", line: "It grows in a nook nobody can walk into." },
  n: { name: "Nestling", kind: "plain", line: "It hatched where the stream begins." },
  e: { name: "Dewdeer",  kind: "rare", line: "It was stuck down in the hollow until the water came." },
  D: { name: "Deepshell", kind: "rare", on: "=", line: "It lives on the riverbed, under the rushing water." },
  m: { name: "Gemgrub",  kind: "rare", line: "A living crystal, in a clearing ringed by trees." },
  R: { name: "Embertail", kind: "rarest", line: "The rarest one. Warm to hold." },
};
const ORDER = ["U", "S", "L", "P", "K", "a", "d", "c", "b", "n", "e", "D", "m", "R"];
const GIVER = { push: "U", vine: "S", glide: "L", swim: "P", burrow: "K" };
const TAG = { helper: "New helper", plain: "New creature", rare: "Rare find", rarest: "The rarest find" };

// Each rare one leaves a trail, drawn on these squares, toward its den.
const TRAILS = {
  e: [[10, 9], [9, 8], [8, 8], [7, 7]],
  D: [[7, 12], [6, 12], [5, 12], [4, 12]],
  m: [[11, 17], [12, 17], [13, 16], [14, 16], [15, 16]],
  R: [[11, 23], [12, 23], [13, 22], [14, 22], [15, 22]],
};
const TRAIL_LOOK = {
  e: ["hoof",  "Hoofprints. Something rare walked here."],
  D: ["slime", "A shiny slime trail. It goes into the river."],
  m: ["crumb", "Crystal crumbs. Something rare dropped them."],
  R: ["ember", "Warm sparks on the ground. Something very rare passed this way."],
};
// What a wall says when you tap it: never which helper it takes.
const BLOCKED_HINT = {
  "t": "Thick trees. No way through.",
  "x": "Solid rock.",
  "~": "Deep water. Too deep to wade.",
  "^": "A sheer cliff. Nothing to hold on to.",
  "v": "A deep crack. Too wide to step over.",
  "o": "A big round boulder. Far too heavy for you.",
  "=": "Fast water. You can't get to it from here.",
  "u": "A deep hollow. The sides are too steep.",
};

const W = MAP[0].length, H = MAP.length;
const idx = (x, y) => y * W + x;
const xy = (i) => [i % W, Math.floor(i / W)];
const inside = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const creatureAt = (x, y) => (CREATURES[MAP[y][x]] ? MAP[y][x] : null);
const mapGround = (x, y) => {
  const ch = MAP[y][x];
  if (CREATURES[ch]) return CREATURES[ch].on || ".";
  return ch === "@" || ch === "o" ? "." : ch;
};
const isRare = (k) => CREATURES[k].kind === "rare" || CREATURES[k].kind === "rarest";
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
let start = { x: 0, y: 0 };
const BOULDER_HOME = [], HOLES = [];
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const ch = MAP[y][x];
  if (ch === "@") start = { x, y };
  if (ch === "o") BOULDER_HOME.push(idx(x, y));
  if (ch === "O") HOLES.push(idx(x, y));
  if (ch === "u") RIVERS[0].fill.squares.push([x, y]);
}
const TRACK = new Map();
for (const k in TRAILS) for (const [x, y] of TRAILS[k]) TRACK.set(idx(x, y), k);
const RIVER_SQ = new Map();  // river square -> which river, how far down it, which way it flows
RIVERS.forEach((r, n) => r.path.forEach(([x, y], j) => {
  const [nx, ny] = r.path[j + 1] || r.exit;
  RIVER_SQ.set(idx(x, y), { r: n, j, dir: nx > x ? "right" : nx < x ? "left" : "down" });
}));
const FILL_SQ = new Map();
RIVERS.forEach((r, n) => { if (r.fill) for (const [x, y] of r.fill.squares) FILL_SQ.set(idx(x, y), n); });
const VINE_SQ = new Map(), LOOKOUT = new Map();
VINES.forEach((v, n) => {
  v.up.forEach(([x, y], j) => VINE_SQ.set(idx(x, y), { n, j }));
  if (v.top) LOOKOUT.set(idx(...v.up[v.up.length - 1]), n);
});

// ---- state ----
let S = null;
function fresh() {
  return { x: start.x, y: start.y, seen: new Array(W * H).fill(0), glints: [], found: [], trails: [], met: [],
    boulders: BOULDER_HOME.slice(), bridges: [], stones: [], dams: [], vines: [] };
}
const has = (ability) => S.found.includes(GIVER[ability]);
// a river's most upstream dam (Infinity while it still flows)
function damAt(r) { let m = Infinity; for (const d of S.dams) if (d.r === r && d.j < m) m = d.j; return m; }
const flowing = (r) => damAt(r) === Infinity;
const flooded = (r) => !!RIVERS[r].fill && damAt(r) !== Infinity && damAt(r) > RIVERS[r].fill.below;

// the ground as it is now: boulders, dams and vines change it
function ground(x, y) {
  const i = idx(x, y);
  if (S.boulders.includes(i)) return "o";
  if (S.bridges.includes(i)) return "b";
  if (S.stones.includes(i)) return "k";
  const rs = RIVER_SQ.get(i);
  if (rs) {
    const m = damAt(rs.r);
    if (m === Infinity) return "=";
    if (S.dams.some((d) => d.r === rs.r && d.j === rs.j)) return "d";
    return rs.j < m ? "~" : "_";
  }
  if (FILL_SQ.has(i) && flooded(FILL_SQ.get(i))) return "~";
  const v = VINE_SQ.get(i);
  if (v && S.vines.includes(v.n)) return "V";
  return mapGround(x, y);
}
// high ground is level 1; ramps and vines join both levels; everything else is level 0
const level = (g) => (g === "h" ? 1 : (g === "/" || g === "V" || g === "^") ? null : 0);
const lookout = (i) => LOOKOUT.has(i) && S.vines.includes(LOOKOUT.get(i));
const high = (x, y) => ground(x, y) === "h" || lookout(idx(x, y));
function passable(x, y) {
  const g = ground(x, y);
  if (".sOh/bVkd_".includes(g)) return true;
  if (g === "~") return has("swim");
  return false;
}
// the grown lookout's top counts as high: you get on and off it only by the vine below, or by gliding
const levelAt = (x, y) => (lookout(idx(x, y)) ? 1 : level(ground(x, y)));
function stepOK(x, y, nx, ny) {
  const a = levelAt(x, y), b = levelAt(nx, ny);
  return a === null || b === null || a === b;
}
// a creature you can find by walking onto it right now
function findable(k, i) {
  if (CREATURES[k].on === "=" && ground(...xy(i)) !== "_") return false;  // under rushing or still water
  if (isRare(k)) return S.met.includes(k);
  return true;
}
const trailShows = (k, x, y) => !S.found.includes(k) && S.seen[idx(x, y)];

// Looks around where you stand. Returns what turned up, so the hint line can say it.
function look() {
  const see = high(S.x, S.y) ? SEE_HIGH : SEE;
  const news = { trail: null, met: null };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = (x - S.x) ** 2 + (y - S.y) ** 2, i = idx(x, y);
    if (d <= see) S.seen[i] = 1;
    const k = creatureAt(x, y);
    if (!k || S.found.includes(k)) continue;
    if (isRare(k)) {
      if (d <= MEET && S.seen[i] && !S.met.includes(k) && (CREATURES[k].on !== "=" || ground(x, y) === "_")) { S.met.push(k); news.met = k; }
      continue;
    }
    if (d <= GLINT && !S.glints.includes(i)) S.glints.push(i);
  }
  for (const k in TRAILS) {
    if (S.trails.includes(k) || S.found.includes(k)) continue;
    if (TRAILS[k].some(([x, y]) => trailShows(k, x, y))) { S.trails.push(k); news.trail = k; }
  }
  return news;
}

// You move one square at a time, by pushing a stick or an arrow key. Everything happens because you walked into it.
// The hole you come up out of: of the holes you've seen, the one lying most the way you were walking (then the nearest).
function burrowTo(h, dx, dy) {
  const [hx, hy] = xy(h);
  let best = null, bestCos = -2, bestLen = Infinity;
  for (const o of HOLES) {
    if (o === h || !S.seen[o] || ground(...xy(o)) !== "O") continue;
    const [ox, oy] = xy(o), vx = ox - hx, vy = oy - hy, len = Math.hypot(vx, vy);
    const cos = (vx * dx + vy * dy) / len;
    if (cos > bestCos + 1e-9 || (Math.abs(cos - bestCos) <= 1e-9 && len < bestLen)) { best = o; bestCos = cos; bestLen = len; }
  }
  return best;
}
// What one push in a straight direction does from (x, y): walk, ride, burrow, shove, grow, or bump into something.
function stepFrom(x, y, dx, dy) {
  const nx = x + dx, ny = y + dy;
  if (!inside(nx, ny)) return { kind: "bump", g: "t" };
  const n = idx(nx, ny), g = ground(nx, ny);
  if (g === "o") return has("push") ? { kind: "push", n: S.boulders.indexOf(n) } : { kind: "bump", g };
  const v = VINE_SQ.get(n);
  if (v && !S.vines.includes(v.n) && has("vine")) {
    const [sx, sy] = VINES[v.n].soil;
    if (sx === x && sy === y) return { kind: "grow", n: v.n, at: n };
  }
  const rs = RIVER_SQ.get(n);
  if (rs && g === "=") {
    if (levelAt(x, y) !== 0 || !S.seen[n]) return { kind: "bump", g };
    const ex = idx(...RIVERS[rs.r].exit);
    return ex === idx(x, y) ? { kind: "bump", g } : { kind: "ride", to: ex, r: rs.r, j: rs.j };
  }
  if (!S.seen[n] || !passable(nx, ny)) return { kind: "bump", g };
  if (!stepOK(x, y, nx, ny)) return { kind: "bump", g, edge: true };
  if (g === "O" && has("burrow")) {
    const to = burrowTo(n, dx, dy);
    if (to !== null) return { kind: "burrow", hole: n, to };
  }
  return { kind: "walk", to: n };
}
// Gliding: from up high, push toward the edge and you fly that way (8 directions) as far as a glide goes,
// over whatever is below, landing on the last spot along the way you can stand on. Null if there's none.
function glideTo(x, y, dx, dy) {
  if (!has("glide") || !high(x, y)) return null;
  if (!inside(x + dx, y + dy) || high(x + dx, y + dy)) return null;
  let land = null;
  for (let k = 1; ; k++) {
    const tx = x + k * dx, ty = y + k * dy;

const SAVE_KEY = "fogmap-sketch-6";

// ---- drawing ----
const viewEl = document.getElementById("view");

ORDER.forEach((k, i) => {

function draw() {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = idx(x, y), el = tiles[i];
    const alt = (x * 13 + y * 7 + x * y) % 7 === 0 ? " alt" : "";
    const k = creatureAt(x, y), waiting = k && !S.found.includes(k);
    let html = "", cls;
    if (S.seen[i]) {
      const g = rollingFrom === i ? "." : ground(x, y);
      cls = "t g-" + GROUND_CLASS[g] + alt;
      if (g === "h" && y + 1 < H && ground(x, y + 1) !== "h" && ground(x, y + 1) !== "/") cls += " edge";
      if (g === "=") cls += " " + RIVER_SQ.get(i).dir;
      if (growing.has(i)) cls += " grow";
      const tk = TRACK.get(i);
      if (tk && trailShows(tk, x, y)) html += trackArt(tk);
      if (waiting && findable(k, i)) html += art(k, "cr " + CREATURES[k].kind);
      if (sign && idx(...sign.at) === i) html += `<span class="sign ${sign.look}"></span>`;
    } else {

  document.getElementById("pctBar").style.width = pct + "%";
  document.getElementById("count").textContent = S.found.length + " / " + ORDER.length;
  ORDER.forEach((k, i) => {
    const got = S.found.includes(k), el = slotEls[k];
    el.classList.toggle("got", got);
    const face = got ? art(k) : (TRAILS[k] && S.trails.includes(k) ? trackArt(k) : "?");

// ---- camera: keep you near the middle; "Whole map" shrinks it to fit ----
let whole = false, tile = 30;
function fit() {

const zoomBtn = document.getElementById("zoom");

// ---- finding a creature ----
const cardEl = document.getElementById("card");

// ---- moving ----
const SLOW = matchMedia("(prefers-reduced-motion: reduce)").matches;
const T = SLOW ? { step: 50, glide: 60, swept: 40, push: 60, sink: 40, rise: 40, grow: 60, roll: 20 }

const MOVE_CLASSES = ["glide", "swept", "sink", "rise", "jump", "push"];
const setMove = (...on) => { MOVE_CLASSES.forEach((c) => meEl.classList.toggle(c, on.includes(c))); };

// plays out a list of steps; done(stopped) runs at the end; stopped means a find or a rare one cut it short
function go(steps, done = () => {}) {
  if (walk) clearTimeout(walk);
  let rode = false;
  const arrive = () => {
    const i = idx(S.x, S.y);
    const news = look();
    const k = creatureAt(S.x, S.y);
    if (k && !S.found.includes(k) && findable(k, i)) { walk = null; setMove(); find(k); done(true); return true; }
    draw();
    tell(news);
    save();
    if (news.met) { walk = null; setMove(); done(true); return true; }  // stop so you see a rare one before you walk off
    return false;
  };
  const tick = () => {
    if (!steps.length) {
      walk = null; setMove(); save();
      if (ground(S.x, S.y) === "O" && !has("burrow")) say("A deep burrow. It goes down a long way.", false);
      else if (rode && !hintEl.classList.contains("news")) say("The fast water carried you all the way to where it ends.", false);
      done(false);
      return;
    }
    const { i, kind, n } = steps.shift();
    const [nx, ny] = xy(i);
    if (kind === "grow") {
      // the vine grows up the cliff, bottom first, and stays
      S.vines.push(n);
      growing = new Set(VINES[n].up.map(([x, y]) => idx(x, y)));
      draw(); save();
      say(VINES[n].top ? "A vine grows all the way up the rock." : "A vine grows up the cliff.", true, "S");
      setTimeout(() => { growing = new Set(); draw(); }, T.grow + 200);

    if (kind === "burrow") {
      setMove("sink");
      later(() => {

    setMove(kind === "glide" ? "glide" : kind === "swept" || kind === "plunge" ? "swept" : null);
    S.x = nx; S.y = ny;

// shove boulder n away from you, one square direction (dx, dy); done(stuck) runs once it has stopped
function push(n, dx, dy, done = () => {}) {
  const plan = rollPlan(n, dx, dy);
  setMove("push");
  setTimeout(() => setMove(), 420);
  if (plan.what === "stuck") { say("It won't budge.", false); setTimeout(() => done(true), T.push); return; }
  const from = S.boulders[n];
  const wasFlooded = flooded(0);
  const el = document.createElement("div");
  el.className = "rolling spin";
  const place = (i) => { const [x, y] = xy(i); el.style.transform = `translate(${x * tile}px, ${y * tile}px)`; };
  place(from);
  mapEl.appendChild(el);
  rollingFrom = from; busy = true; draw();
  const hops = plan.what === "home" ? [plan.end] : plan.route.concat(plan.what === "stop" ? [] : [plan.end]);
  let h = 0;
  const hop = () => {
    if (h < hops.length) { el.style.transition = `transform ${T.roll}ms linear`; place(hops[h++]); setTimeout(hop, T.roll); return; }
    el.remove(); rollingFrom = -1; busy = false;
    applyRoll(n, plan);
    look(); draw(); save();
    if (plan.what === "dam") {
      const r = RIVERS[plan.r], changed = r.path.map(([x, y]) => idx(x, y));
      if (r.fill && flooded(plan.r) && !wasFlooded) changed.push(...r.fill.squares.map(([x, y]) => idx(x, y)));
      flash(changed);
      say("The river stops. Below the boulder, the riverbed runs dry." +
          (r.fill && flooded(plan.r) && !wasFlooded ? " Above it, the water spills into the hollow." : ""), true);
    } else if (plan.what === "bridge") { flash([plan.end]); say("The boulder drops into the crack and wedges there. You can walk across.", true); }
    else if (plan.what === "stone") { flash([plan.end]); say("The boulder sinks. Its top sticks out of the water.", true); }

const stickEl = document.getElementById("stick"), knobEl = document.getElementById("knob");

viewEl.addEventListener("pointerdown", (e) => {

addEventListener("blur", () => { keys.clear(); stick = null; stickEl.hidden = true; inputChanged(); });

// ---- stuck: after a long while with no new find, one unsolved spot shows a sign ----
let STUCK_MS = 150000, quietSince = Date.now();
setInterval(() => {
  if (sign && !sign.want()) { sign = null; draw(); }
  if (sign || !cardEl.hidden || Date.now() - quietSince < STUCK_MS) return;
  const s = SIGNS.find((s) => s.want() && S.seen[idx(...s.at)]);
  if (!s) return;
  sign = s; quietSince = Date.now();
  draw(); say(s.line, true);
}, 3000);

// ---- start over (tap twice) ----
const resetBtn = document.getElementById("reset");
let armed = null;
resetBtn.addEventListener("click", () => {
  if (!armed) {
    resetBtn.classList.add("armed"); resetBtn.textContent = "Tap again to wipe";
    armed = setTimeout(() => { armed = null; resetBtn.classList.remove("armed"); resetBtn.textContent = "Start over"; }, 3000);
    return;
  }
  clearTimeout(armed); armed = null;
  resetBtn.classList.remove("armed"); resetBtn.textContent = "Start over";
  if (walk) clearTimeout(walk);
  walk = null; pulsing = new Set(); growing = new Set(); rollingFrom = -1; sign = null; setMove();
  moving = false; needRelease = false; lean = null;
  S = fresh(); quietSince = Date.now(); look(); draw(); save();
  say("Drag anywhere on the map to walk. On a computer, use the arrow keys.", false);
});

// ---- go ----
// For checking only, never saved:
//   #peek      the whole map, every helper held; the stuck sign comes after 6 seconds
//   #peek-dam  the same, with the river already dammed and the lone rock's vine grown, standing on top
//   add @x,y to either to stand somewhere else, e.g. #peek-dam@5,11
if (location.hash.startsWith("#peek")) {
  saving = false; STUCK_MS = 6000;
  S.seen.fill(1); S.found = ["U", "S", "L", "P", "K"];
  if (location.hash.startsWith("#peek-dam")) { S.boulders[0] = -1; S.dams.push({ r: 0, j: 5 }); S.vines.push(1); S.x = 14; S.y = 19; }
  const at = location.hash.match(/@(\d+),(\d+)/);
  if (at) { S.x = +at[1]; S.y = +at[2]; }
} else {
  load();
}
look();
draw();
fit();
</script>
